[package]
name = "superx-mod-repos"
description = "Repos: the git repositories the agents work in, read read-only and kept in the module's own database — its own executable, superx-repos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Its own executable (operator, 2026-10-24): its own process, database and
# URL, never linked into `superx`, so nothing it does can reach capture.
[[bin]]
name = "superx-repos"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
clap.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
superx-kernel = { path = "../superx-kernel" }
tokio = { workspace = true, features = ["signal", "net"] }
tracing.workspace = true

[dev-dependencies]
surrealdb.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
