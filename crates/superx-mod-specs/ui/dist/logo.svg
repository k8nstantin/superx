<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SuperX">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9500BF"/>
      <stop offset="1" stop-color="#CC66FF"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CC66FF"/>
      <stop offset="1" stop-color="#B833E8"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1F062A"/>
  <!-- the X as a graph: four entities, one kernel hub -->
  <g stroke="url(#edge)" stroke-width="7" stroke-linecap="round">
    <line x1="38" y1="38" x2="64" y2="64"/>
    <line x1="90" y1="38" x2="64" y2="64"/>
    <line x1="38" y1="90" x2="64" y2="64"/>
    <line x1="90" y1="90" x2="64" y2="64"/>
  </g>
  <circle cx="38" cy="38" r="11" fill="#9500BF"/>
  <circle cx="90" cy="38" r="11" fill="#B833E8"/>
  <circle cx="38" cy="90" r="11" fill="#B833E8"/>
  <circle cx="90" cy="90" r="11" fill="#9500BF"/>
  <circle cx="64" cy="64" r="19" fill="#CC66FF" opacity="0.18"/>
  <circle cx="64" cy="64" r="13.5" fill="url(#hub)"/>
</svg>
