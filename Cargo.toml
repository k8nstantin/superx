[workspace]
resolver = "2"
members = ["crates/superx-kernel", "crates/superx-mod-entities", "crates/superx-mod-hello", "crates/superx-mod-runner", "crates/superx-mod-ui", "crates/superx-mod-website", "crates/superx-ops", "crates/superx"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"

[workspace.dependencies]
superx-kernel = { path = "crates/superx-kernel" }
superx-mod-entities = { path = "crates/superx-mod-entities" }
superx-mod-hello = { path = "crates/superx-mod-hello" }
superx-mod-runner = { path = "crates/superx-mod-runner" }
superx-mod-ui = { path = "crates/superx-mod-ui" }
superx-mod-website = { path = "crates/superx-mod-website" }
superx-ops = { path = "crates/superx-ops" }

# Substrate SDK — kv-mem for in-process tests; protocol-ws for the
# wire protocol the operator-provisioned standalone server speaks.
surrealdb = { version = "3", default-features = false, features = ["protocol-ws", "kv-mem"] }

async-trait = "0.1"
clap      = { version = "4", features = ["derive", "env"] }
chrono    = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
# Compile-time inventory — modules/adapters register descriptors via
# #[distributed_slice]; the kernel iterates, nothing enumerates.
linkme    = "0.3"
rpassword  = "7"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
ts-rs      = { version = "11", features = ["chrono-impl"] }
tokio     = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
uuid      = { version = "1", features = ["v7", "serde"] }

# The UI module's HTTP layer (SSE lives in axum core).
axum = "0.8"

# Kernel self-log — rolling file log independent of the substrate
# (boot diagnostics must survive substrate unavailability).
tracing            = "0.1"
tracing-appender   = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tempfile = "3"
